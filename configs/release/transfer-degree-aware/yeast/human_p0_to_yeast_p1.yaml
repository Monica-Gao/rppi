seed: 20260503
data:
  embedding_dir: data/embeddings/human
  sequence_length: 795
  embed_dim: 1024
  preload: false
  cache_embeddings: false
  train:
    tsv: data/dscript-transfer-degree-aware/variants/yeast/bernett_style/human_p0_to_yeast_p1/human_inner_train.tsv
  valid:
    tsv: data/dscript-transfer-degree-aware/variants/yeast/bernett_style/human_p0_to_yeast_p1/human_inner_valid.tsv
  test:
    tsv: data/dscript-transfer-degree-aware/variants/yeast/bernett_style/human_p0_to_yeast_p1/yeast_test.tsv
    embedding_dir: data/embeddings/yeast
model:
  input_dim: 1024
  hidden_dim: 192
  num_heads: 6
  num_layers: 2
  cross_layers: 2
  ff_dim: 768
  dropout: 0.15
  chunk_size: 16
  sequence_length: 795
  projection_dim: 256
training:
