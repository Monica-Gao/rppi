  patience: 4
  monitor: bce
  monitor_mode: min
  log_every: 200
  auto_resume: true
  evaluate_test_at_end: true
  contrastive_temperature: 0.1
  rank_margin: 0.5
  loss_weights:
    symmetry: 0.05
    contrastive: 0.0
    ranking: 0.0
  symmetric_eval: true
output:
  name: rppi-transfer-degree-aware-yeast-human_p0_to_yeast_p1
  dir: runs/rppi-transfer-degree-aware-yeast-human_p0_to_yeast_p1
