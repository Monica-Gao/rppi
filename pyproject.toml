[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "rppi"
version = "0.0.0"  # Internal packaging placeholder; no numbered release.
description = "Reciprocal Protein Pair Inference (RPPI) for sequence-based protein interaction prediction"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24", "PyYAML>=6", "scikit-learn>=1.3"]
[project.optional-dependencies]
embeddings = ["transformers==4.44.2", "tokenizers==0.19.1", "sentencepiece==0.2.0", "huggingface-hub==0.25.2", "protobuf==5.28.3"]
test = ["pytest>=8"]
[project.scripts]
rppi = "rppi.cli:main"
[tool.setuptools.packages.find]
include = ["rppi*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
